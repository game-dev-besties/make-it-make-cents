# Character roster. `tools/fetch_sprites.py` reads the seed/expression set
# from its own table; this file is the human-facing manifest used by
# tools/generate_characters.gd (run in-editor) to build Dialogic .dch files.
#
# Each portrait is looked up as art/characters/<id>/<expression>.png.

characters:
  - id: son
    display_name: "Leo"
    color: "#5fb3f5"
    default_portrait: neutral
  - id: dad
    display_name: "Marco"
    color: "#f5a35f"
    default_portrait: neutral
  - id: mom
    display_name: "Elena"
    color: "#f55f8a"
    default_portrait: neutral
  - id: grandma
    display_name: "Rosa"
    color: "#c08af5"
    default_portrait: neutral
  - id: crush
    display_name: "Mira"
    color: "#f56fb0"
    default_portrait: neutral
  - id: interviewer
    display_name: "Mr. Reed"
    color: "#8aa0b5"
    default_portrait: neutral
  - id: doctor
    display_name: "Dr. Park"
    color: "#6fb3a0"
    default_portrait: neutral

# The set of expressions every character has sprites for.
expressions:
  - neutral
  - happy
  - sad
  - angry
  - surprised
  - nervous
  - confident
  - confused

# Cutscene manifest — the ordered list of cutscenes the game plays.
# Like ChoiceScript's *scene_list, but typed. Budget resets per cutscene.
#
# `scripts` is an ordered list (without the .md extension) so a writer CAN
# split one cutscene across multiple files; the compiler stitches them into a
# single Dialogic timeline in this order. Each entry lives at
# story/scripts/<id>/<script>.md — files within a cutscene's subdir are
# numbered from 1_ so `ls` shows play order.

cutscenes:
  - id: son
    name: "Son Asks Out a Girl"
    budget: 80
    scripts: [1_son_asks_out]   # TODO: stub only — not written yet

  - id: dad
    name: "Dad's Job Interview"
    budget: 100
    scripts: [1_dad_job_interview]   # the actual proof-of-concept content

  - id: grandma
    name: "Grandma at the Doctor"
    budget: 70
    scripts: [1_grandma_doctor]   # TODO: stub only — not written yet

  - id: neighbors
    name: "Visiting the Neighbors"
    budget: 120
    scripts: [1_neighbors_ending]   # reads crush/interviewer/doctor stats above
